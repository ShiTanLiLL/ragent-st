# 正常运行应用时连接 compose.yaml 启动的本地教学数据库。
spring.datasource.url=jdbc:postgresql://localhost:5432/ragent
spring.datasource.username=ragent
spring.datasource.password=ragent

# Flyway 在 Spring 创建业务 Bean 前执行版本化 SQL，保证表和 pgvector 扩展已经存在。
spring.flyway.enabled=true

# 第 13 课会话记忆：模型每轮保留的近期原文、摘要触发轮数和摘要字数上限。
ragent.memory.recent-turns=2
ragent.memory.summary-trigger-turns=4
ragent.memory.summary-max-chars=300
